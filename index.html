<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Good Eats</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..900;1,9..144,400..700&family=Karla:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>

  /* ============================================================
     RECIPE DATA lives down in the <script> tag near the bottom,
     in the section marked "ADD YOUR RECIPES HERE". Edit that array
     to add, remove, or change recipes. The "category" field for
     each recipe must be exactly one of: Dinner, Lunch, Breakfast,
     Dessert, Beverages.
     ============================================================ */

  :root{
    --cream: #F6EDDD;
    --card: #FFFCF5;
    --walnut: #34241A;
    --walnut-soft: #6B5A4C;
    --rust: #B5482A;
    --rust-dark: #8F3A22;
    --sage: #75845E;
    --butter: #E9B64C;
    --plum: #A15C74;
    --steel: #4C7B8C;
    --line: #DCCBA8;
    --shadow: rgba(52, 36, 26, 0.18);
  }

  *{ box-sizing: border-box; }

  body{
    margin:0;
    background: var(--cream);
    background-image:
      radial-gradient(circle at 15% 10%, rgba(255,255,255,0.35), transparent 40%),
      radial-gradient(circle at 85% 90%, rgba(255,255,255,0.25), transparent 45%);
    color: var(--walnut);
    font-family: 'Karla', sans-serif;
    min-height: 100vh;
  }

  a{ color: inherit; }
  button{ font-family: inherit; cursor: pointer; }

  button:focus-visible, a:focus-visible, input:focus-visible, [tabindex]:focus-visible{
    outline: 3px solid var(--rust);
    outline-offset: 2px;
  }

  .wrap{
    max-width: 900px;
    margin: 0 auto;
    padding: 0 24px 80px;
  }

  header.site{
    padding: 40px 24px 26px;
    text-align: center;
  }

  .site-title{
    font-family: 'Fraunces', serif;
    font-weight: 700;
    font-style: italic;
    font-size: clamp(2.4rem, 6vw, 3.6rem);
    margin: 0;
    letter-spacing: -0.01em;
  }

  .site-title span{ color: var(--rust); }

  .site-tagline{
    margin: 10px auto 0;
    max-width: 480px;
    color: var(--walnut-soft);
    font-size: 1rem;
    line-height: 1.5;
  }

  /* ---------- Controls bar ---------- */

  .controls{
    display: flex;
    flex-wrap: wrap;
    gap: 14px;
    align-items: center;
    justify-content: space-between;
    margin: 28px 0 30px;
  }

  .search-box{
    position: relative;
    flex: 1 1 240px;
    max-width: 360px;
  }

  .search-box input{
    width: 100%;
    padding: 10px 14px 10px 36px;
    border: 1.5px solid var(--line);
    border-radius: 999px;
    background: var(--card);
    font-family: 'Karla', sans-serif;
    font-size: 0.95rem;
    color: var(--walnut);
  }

  .search-box input::placeholder{ color: #B3A388; }

  .search-box svg{
    position: absolute;
    left: 12px; top: 50%;
    transform: translateY(-50%);
    width: 16px; height: 16px;
    stroke: var(--walnut-soft);
  }

  .wheel-btn{
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: var(--walnut);
    color: var(--cream);
    border: none;
    padding: 11px 20px;
    border-radius: 999px;
    font-weight: 700;
    font-size: 0.9rem;
    box-shadow: 0 3px 0 var(--rust-dark);
    transition: transform 0.1s ease, box-shadow 0.1s ease;
    flex: none;
  }

  .wheel-btn:hover{ transform: translateY(-1px); }
  .wheel-btn:active{ transform: translateY(2px); box-shadow: 0 1px 0 var(--rust-dark); }
  .wheel-btn svg{ width: 18px; height: 18px; }

  /* ---------- Category accordion ---------- */

  .accordion{
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .cat-section{
    background: var(--card);
    border-radius: 4px;
    box-shadow: 0 6px 14px -8px var(--shadow);
    overflow: hidden;
    border-left: 6px solid var(--cat-color, var(--rust));
  }

  .cat-header{
    width: 100%;
    display: flex;
    align-items: center;
    gap: 12px;
    background: none;
    border: none;
    padding: 16px 20px;
    text-align: left;
  }

  .cat-chevron{
    flex: none;
    width: 22px; height: 22px;
    display: flex; align-items: center; justify-content: center;
    transition: transform 0.2s ease;
    color: var(--cat-color, var(--rust));
  }

  .cat-chevron svg{ width: 16px; height: 16px; }

  .cat-section.open .cat-chevron{ transform: rotate(90deg); }

  .cat-name{
    font-family: 'Fraunces', serif;
    font-weight: 700;
    font-size: 1.2rem;
    flex: 1;
  }

  .cat-count{
    font-size: 0.8rem;
    font-weight: 600;
    color: var(--walnut-soft);
    background: rgba(52,36,26,0.06);
    padding: 3px 10px;
    border-radius: 999px;
  }

  .cat-body{
    max-height: 0;
    overflow: hidden;
    transition: max-height 0.28s ease;
  }

  .cat-section.open .cat-body{
    max-height: 800px;
  }

  .cat-list{
    list-style: none;
    margin: 0;
    padding: 0 20px 14px;
  }

  .cat-list li + li{
    border-top: 1px solid var(--line);
  }

  .cat-list a{
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
    padding: 12px 4px;
    text-decoration: none;
    border-radius: 3px;
  }

  .cat-list a:hover{
    background: rgba(181,72,42,0.06);
  }

  .cat-list .r-title{
    font-weight: 600;
    color: var(--walnut);
  }

  .cat-list .r-time{
    flex: none;
    font-size: 0.8rem;
    color: var(--walnut-soft);
  }

  .cat-empty{
    padding: 14px 4px 16px;
    color: var(--walnut-soft);
    font-size: 0.9rem;
    font-style: italic;
  }

  /* ---------- Search results grid (reuses index-card look) ---------- */

  .results-heading{
    font-size: 0.85rem;
    font-weight: 700;
    color: var(--walnut-soft);
    margin: 0 0 14px;
    text-transform: none;
  }

  .grid{
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 26px 20px;
  }

  .card{
    position: relative;
    background: var(--card);
    border-radius: 3px;
    padding: 22px 20px 20px 34px;
    min-height: 150px;
    box-shadow: 0 8px 16px -6px var(--shadow);
    background-image:
      linear-gradient(to right, transparent 20px, var(--rust) 20px, var(--rust) 21.5px, transparent 21.5px),
      repeating-linear-gradient(to bottom, transparent, transparent 26px, var(--line) 27px);
    text-align: left;
    border: none;
    display: flex;
    flex-direction: column;
    transition: transform 0.18s ease, box-shadow 0.18s ease;
  }

  .card:hover, .card:focus-visible{
    transform: translateY(-4px);
    box-shadow: 0 14px 22px -8px var(--shadow);
  }

  .card::before{
    content: "";
    position: absolute;
    top: 12px; left: 10px;
    width: 9px; height: 9px;
    border-radius: 50%;
    background: var(--cream);
    box-shadow: inset 0 0 0 1.5px var(--line);
  }

  .card-cat{
    align-self: flex-start;
    font-size: 0.68rem;
    font-weight: 700;
    letter-spacing: 0.03em;
    color: var(--sage);
    background: rgba(117,132,94,0.12);
    padding: 3px 9px;
    border-radius: 999px;
    margin-bottom: 10px;
  }

  .card-title{
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: 1.2rem;
    line-height: 1.25;
    margin: 0 0 10px;
  }

  .card-meta{
    margin-top: auto;
    font-size: 0.8rem;
    color: var(--walnut-soft);
  }

  .empty-state{
    text-align: center;
    padding: 50px 20px;
    color: var(--walnut-soft);
  }

  .empty-state h3{
    font-family: 'Fraunces', serif;
    color: var(--walnut);
    margin-bottom: 6px;
  }

  /* ---------- Recipe detail ---------- */

  .detail{
    background: var(--card);
    border-radius: 6px;
    padding: 36px clamp(20px, 5vw, 48px) 46px;
    margin-top: 10px;
    box-shadow: 0 10px 28px -10px var(--shadow);
  }

  .back-link{
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: none;
    border: none;
    color: var(--rust);
    font-weight: 700;
    font-size: 0.9rem;
    padding: 0;
    margin-bottom: 22px;
  }

  .back-link svg{ width: 16px; height: 16px; }

  .detail-cat{
    color: var(--sage);
    font-weight: 700;
    font-size: 0.75rem;
    letter-spacing: 0.03em;
    margin-bottom: 8px;
  }

  .detail-title{
    font-family: 'Fraunces', serif;
    font-weight: 700;
    font-size: clamp(1.8rem, 4vw, 2.5rem);
    margin: 0 0 14px;
  }

  .detail-meta{
    display: flex;
    gap: 22px;
    flex-wrap: wrap;
    color: var(--walnut-soft);
    font-size: 0.9rem;
    margin-bottom: 28px;
    border-bottom: 1.5px dashed var(--line);
    padding-bottom: 22px;
  }

  .detail-meta strong{ color: var(--walnut); }

  .detail-body{
    display: grid;
    grid-template-columns: 1fr 1.5fr;
    gap: 40px;
  }

  @media (max-width: 640px){
    .detail-body{ grid-template-columns: 1fr; }
  }

  .detail h3{
    font-family: 'Fraunces', serif;
    font-size: 1.15rem;
    margin: 0 0 14px;
    color: var(--rust-dark);
  }

  .ingredient-list{ list-style: none; margin: 0; padding: 0; }

  .ingredient-list li{
    display: flex;
    align-items: flex-start;
    gap: 10px;
    padding: 7px 0;
    border-bottom: 1px solid var(--line);
    font-size: 0.95rem;
  }

  .ingredient-list li:last-child{ border-bottom: none; }

  .check{
    flex: none;
    width: 17px; height: 17px;
    margin-top: 2px;
    border: 1.5px solid var(--sage);
    border-radius: 4px;
    background: none;
    padding: 0;
    position: relative;
  }

  .check.checked{ background: var(--sage); }

  .check.checked::after{
    content: "";
    position: absolute;
    left: 4px; top: 1px;
    width: 5px; height: 9px;
    border-right: 2px solid #fff;
    border-bottom: 2px solid #fff;
    transform: rotate(40deg);
  }

  .ing-checked-label{
    text-decoration: line-through;
    color: var(--walnut-soft);
  }

  .steps{ list-style: none; margin: 0; padding: 0; counter-reset: step; }

  .steps li{
    counter-increment: step;
    display: flex;
    gap: 14px;
    padding: 12px 0;
    border-bottom: 1px solid var(--line);
    font-size: 0.97rem;
    line-height: 1.55;
  }

  .steps li:last-child{ border-bottom: none; }

  .steps li::before{
    content: counter(step);
    flex: none;
    width: 26px; height: 26px;
    border-radius: 50%;
    background: var(--rust);
    color: #fff;
    font-family: 'Fraunces', serif;
    font-weight: 700;
    font-size: 0.85rem;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .note{
    margin-top: 30px;
    padding: 16px 18px;
    background: rgba(233,182,76,0.16);
    border-left: 3px solid var(--butter);
    font-size: 0.92rem;
    font-style: italic;
    color: var(--walnut-soft);
    border-radius: 0 4px 4px 0;
  }

  /* ---------- Wheel view ---------- */

  .wheel-page{ text-align: center; padding-top: 10px; }

  .wheel-page h2{
    font-family: 'Fraunces', serif;
    font-size: clamp(1.7rem, 4vw, 2.3rem);
    margin: 4px 0 6px;
  }

  .wheel-page p.sub{
    color: var(--walnut-soft);
    margin: 0 0 22px;
  }

  .wheel-filters{
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 28px;
  }

  .pill{
    border: 1.5px solid var(--line);
    background: var(--card);
    color: var(--walnut-soft);
    padding: 7px 15px;
    border-radius: 999px;
    font-size: 0.85rem;
    font-weight: 600;
    transition: background 0.15s ease, color 0.15s ease, border-color 0.15s ease;
  }

  .pill:hover{ border-color: var(--rust); }

  .pill.active{
    background: var(--rust);
    border-color: var(--rust);
    color: #fff;
  }

  .wheel-stage{
    position: relative;
    width: min(320px, 80vw);
    height: min(320px, 80vw);
    margin: 0 auto 30px;
  }

  .pointer{
    position: absolute;
    top: -6px; left: 50%;
    transform: translateX(-50%);
    width: 0; height: 0;
    border-left: 14px solid transparent;
    border-right: 14px solid transparent;
    border-top: 22px solid var(--walnut);
    z-index: 3;
    filter: drop-shadow(0 2px 2px rgba(0,0,0,0.25));
  }

  .wheel-svg-wrap{
    width: 100%; height: 100%;
    border-radius: 50%;
    box-shadow: 0 10px 30px -8px var(--shadow), 0 0 0 8px var(--card), 0 0 0 10px var(--line);
    transition: transform 3.2s cubic-bezier(0.17, 0.67, 0.12, 0.99);
  }

  .wheel-svg-wrap svg{ display:block; width:100%; height:100%; }

  .hub{
    position: absolute;
    top: 50%; left: 50%;
    width: 46px; height: 46px;
    background: var(--card);
    border-radius: 50%;
    transform: translate(-50%,-50%);
    box-shadow: 0 0 0 3px var(--rust), 0 2px 6px rgba(0,0,0,0.2);
    z-index: 2;
  }

  .wheel-empty{
    color: var(--walnut-soft);
    font-style: italic;
    padding: 20px;
  }

  .spin-btn{
    background: var(--rust);
    color: #fff;
    border: none;
    padding: 14px 34px;
    font-size: 1rem;
    font-weight: 700;
    border-radius: 999px;
    box-shadow: 0 4px 0 var(--rust-dark);
    transition: transform 0.1s ease, box-shadow 0.1s ease;
  }

  .spin-btn:hover{ transform: translateY(-1px); }
  .spin-btn:active{ transform: translateY(3px); box-shadow: 0 1px 0 var(--rust-dark); }
  .spin-btn:disabled{ opacity: 0.5; cursor: default; transform:none; box-shadow: 0 4px 0 var(--rust-dark); }

  .wheel-result{ margin-top: 28px; min-height: 90px; }

  .wheel-result .reveal{
    display: inline-block;
    background: var(--card);
    padding: 18px 26px;
    border-radius: 6px;
    box-shadow: 0 8px 18px -8px var(--shadow);
    animation: pop 0.35s ease;
  }

  @keyframes pop{
    from{ transform: scale(0.9); opacity: 0; }
    to{ transform: scale(1); opacity: 1; }
  }

  .wheel-result .reveal p{
    margin: 0 0 4px;
    color: var(--walnut-soft);
    font-size: 0.85rem;
  }

  .wheel-result .reveal h3{
    font-family: 'Fraunces', serif;
    margin: 0 0 14px;
    font-size: 1.4rem;
  }

  .wheel-result .reveal a.go{
    color: var(--rust);
    font-weight: 700;
    text-decoration: none;
    border-bottom: 2px solid var(--rust);
    padding-bottom: 1px;
  }

  footer.site{
    text-align: center;
    padding: 30px;
    color: var(--walnut-soft);
    font-size: 0.8rem;
  }

  @media (prefers-reduced-motion: reduce){
    .wheel-svg-wrap{ transition: none; }
    .card, .wheel-btn, .spin-btn, .cat-chevron, .cat-body{ transition: none; }
  }
</style>
</head>
<body>

<header class="site">
  <h1 class="site-title">Good<span>&nbsp;Eats</span></h1>
  <p class="site-tagline">A tantalizingly delicious selection of only the best verified recipes to quell your hunger. Not sure what to cook? Spin the wheel!</p>
</header>

<div class="wrap">
  <div id="app"></div>
</div>

<footer class="site">Good Eats — kept and updated one recipe at a time.</footer>

<script>
/* ============================================================
   ADD YOUR RECIPES HERE
   Copy an existing object, give it a unique "id" (no spaces),
   and fill in your own details. "category" must be exactly one
   of: Dinner, Lunch, Breakfast, Dessert, Beverages.
   ============================================================ */

const RECIPES = [
  {
    id: "chicken-noodle-soup",
    title: "Grandma's Chicken Noodle Soup",
    category: "Dinner",
    time: "45 min",
    servings: "6",
    ingredients: [
      "1 whole rotisserie chicken, shredded",
      "8 cups chicken broth",
      "3 carrots, sliced",
      "3 celery stalks, sliced",
      "1 yellow onion, diced",
      "3 cloves garlic, minced",
      "2 cups egg noodles",
      "2 tbsp fresh dill, chopped",
      "Salt and pepper to taste"
    ],
    steps: [
      "In a large pot, sauté the onion, carrots, and celery in a little oil over medium heat until softened, about 6 minutes.",
      "Add the garlic and cook for another minute, until fragrant.",
      "Pour in the chicken broth and bring to a gentle boil.",
      "Add the shredded chicken and let simmer for 15 minutes.",
      "Stir in the egg noodles and cook until tender, about 8 minutes.",
      "Season with salt and pepper, stir in the fresh dill, and serve hot."
    ],
    note: "Grandma always added extra dill right at the end — don't skip it."
  },
  {
    id: "skillet-cornbread",
    title: "Skillet Cornbread",
    category: "Breakfast",
    time: "35 min",
    servings: "8",
    ingredients: [
      "1 cup cornmeal",
      "1 cup all-purpose flour",
      "1/4 cup sugar",
      "1 tbsp baking powder",
      "1/2 tsp salt",
      "1 cup buttermilk",
      "2 large eggs",
      "1/4 cup melted butter, plus extra for the skillet",
      "1/4 cup honey"
    ],
    steps: [
      "Preheat the oven to 400°F (200°C) and place a cast iron skillet inside to heat up.",
      "Whisk together the cornmeal, flour, sugar, baking powder, and salt in a large bowl.",
      "In a separate bowl, whisk the buttermilk, eggs, melted butter, and honey together.",
      "Pour the wet ingredients into the dry ingredients and stir until just combined — a few lumps are fine.",
      "Carefully remove the hot skillet, add a pat of butter to coat the bottom, then pour in the batter.",
      "Bake for 20–22 minutes, until golden on top and a toothpick comes out clean."
    ],
    note: "The hot skillet is what gives the edges that crisp, almost-fried crust."
  }
];

/* ============================================================
   Everything below this line runs the site — no need to edit it.
   ============================================================ */

const CATEGORIES = ["Dinner", "Lunch", "Breakfast", "Dessert", "Beverages"];
const CATEGORY_COLORS = {
  Dinner: "var(--rust)",
  Lunch: "var(--butter)",
  Breakfast: "var(--sage)",
  Dessert: "var(--plum)",
  Beverages: "var(--steel)"
};

const app = document.getElementById('app');
let searchTerm = '';
let openCategories = {};

function renderHome(){
  const term = searchTerm.trim().toLowerCase();

  app.innerHTML = `
    <div class="controls">
      <div class="search-box">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input id="search-input" type="text" placeholder="Search recipes..." value="${escapeAttr(searchTerm)}">
      </div>
      <button class="wheel-btn" id="wheel-btn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 3v18M3 12h18"/></svg>
        Spin the Wheel
      </button>
    </div>
    <div id="list-area"></div>
  `;

  document.getElementById('wheel-btn').addEventListener('click', () => { location.hash = '#/wheel'; });

  const input = document.getElementById('search-input');
  input.addEventListener('input', e => {
    searchTerm = e.target.value;
    renderListArea();
  });

  renderListArea();

  function renderListArea(){
    const area = document.getElementById('list-area');
    const term = searchTerm.trim().toLowerCase();

    if(term !== ''){
      const filtered = RECIPES.filter(r => r.title.toLowerCase().includes(term));
      area.innerHTML = `
        <p class="results-heading">${filtered.length} result${filtered.length === 1 ? '' : 's'} for "${escapeHtml(searchTerm.trim())}"</p>
        <div class="grid">
          ${filtered.length === 0 ? `
            <div class="empty-state">
              <h3>No recipes match that search</h3>
              <p>Try a different word, or clear the search box.</p>
            </div>
          ` : filtered.map(cardHtml).join('')}
        </div>
      `;
      area.querySelectorAll('.card').forEach(card => {
        card.addEventListener('click', () => { location.hash = '#/recipe/' + card.dataset.id; });
      });
      return;
    }

    area.innerHTML = `<div class="accordion">${CATEGORIES.map(catSectionHtml).join('')}</div>`;

    area.querySelectorAll('.cat-header').forEach(btn => {
      btn.addEventListener('click', () => {
        const cat = btn.dataset.cat;
        openCategories[cat] = !openCategories[cat];
        renderListArea();
      });
    });
  }
}

function catSectionHtml(cat){
  const recipes = RECIPES.filter(r => r.category === cat);
  const isOpen = !!openCategories[cat];
  return `
    <div class="cat-section ${isOpen ? 'open' : ''}" style="--cat-color: ${CATEGORY_COLORS[cat]}">
      <button class="cat-header" data-cat="${escapeAttr(cat)}" aria-expanded="${isOpen}">
        <span class="cat-chevron">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
        </span>
        <span class="cat-name">${escapeHtml(cat)}</span>
        <span class="cat-count">${recipes.length}</span>
      </button>
      <div class="cat-body">
        <ul class="cat-list">
          ${recipes.length === 0
            ? `<li class="cat-empty">No recipes in this category yet.</li>`
            : recipes.map(r => `
                <li>
                  <a href="#/recipe/${escapeAttr(r.id)}">
                    <span class="r-title">${escapeHtml(r.title)}</span>
                    <span class="r-time">${escapeHtml(r.time)}</span>
                  </a>
                </li>
              `).join('')
          }
        </ul>
      </div>
    </div>
  `;
}

function cardHtml(r){
  return `
    <button class="card" data-id="${escapeAttr(r.id)}" tabindex="0" aria-label="Open ${escapeAttr(r.title)}">
      <span class="card-cat">${escapeHtml(r.category)}</span>
      <h2 class="card-title">${escapeHtml(r.title)}</h2>
      <div class="card-meta">${escapeHtml(r.time)} · Serves ${escapeHtml(r.servings)}</div>
    </button>
  `;
}

function renderDetail(id){
  const r = RECIPES.find(x => x.id === id);
  if(!r){ location.hash = '#/'; return; }

  app.innerHTML = `
    <div class="detail">
      <button class="back-link" id="back-btn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M15 18l-6-6 6-6"/></svg>
        Back to recipes
      </button>
      <div class="detail-cat">${escapeHtml(r.category)}</div>
      <h2 class="detail-title">${escapeHtml(r.title)}</h2>
      <div class="detail-meta">
        <span><strong>${escapeHtml(r.time)}</strong> to make</span>
        <span>Serves <strong>${escapeHtml(r.servings)}</strong></span>
      </div>
      <div class="detail-body">
        <div>
          <h3>Ingredients</h3>
          <ul class="ingredient-list" id="ing-list">
            ${r.ingredients.map((ing, i) => `
              <li>
                <button class="check" data-i="${i}" aria-label="Mark ${escapeAttr(ing)} as gathered"></button>
                <span class="ing-label" data-i="${i}">${escapeHtml(ing)}</span>
              </li>
            `).join('')}
          </ul>
        </div>
        <div>
          <h3>Steps</h3>
          <ol class="steps">
            ${r.steps.map(s => `<li>${escapeHtml(s)}</li>`).join('')}
          </ol>
          ${r.note ? `<div class="note">${escapeHtml(r.note)}</div>` : ''}
        </div>
      </div>
    </div>
  `;

  document.getElementById('back-btn').addEventListener('click', () => { location.hash = '#/'; });
  document.querySelectorAll('.check').forEach(btn => {
    btn.addEventListener('click', () => {
      btn.classList.toggle('checked');
      const label = document.querySelector(`.ing-label[data-i="${btn.dataset.i}"]`);
      label.classList.toggle('ing-checked-label');
    });
  });
}

/* ---------- Wheel ---------- */

const WHEEL_PALETTE = ['#B5482A', '#75845E', '#E9B64C', '#A15C74', '#4C7B8C', '#6B5A4C'];
let wheelRotation = 0;
let wheelCategory = 'All';

function wheelRecipes(){
  return wheelCategory === 'All' ? RECIPES : RECIPES.filter(r => r.category === wheelCategory);
}

function buildWheelSvg(recipes){
  const n = recipes.length;
  const seg = 360 / n;
  const cx = 150, cy = 150, r = 148;
  let paths = '';
  let labels = '';

  for(let i = 0; i < n; i++){
    const startAngle = i * seg;
    const endAngle = (i + 1) * seg;
    const [x1, y1] = polarToCartesian(cx, cy, r, startAngle);
    const [x2, y2] = polarToCartesian(cx, cy, r, endAngle);
    const largeArc = seg > 180 ? 1 : 0;
    const color = WHEEL_PALETTE[i % WHEEL_PALETTE.length];
    paths += `<path d="M${cx},${cy} L${x1},${y1} A${r},${r} 0 ${largeArc},1 ${x2},${y2} Z" fill="${color}" stroke="#FFFCF5" stroke-width="2"/>`;

    const midAngle = startAngle + seg / 2;
    const [lx, ly] = polarToCartesian(cx, cy, r * 0.62, midAngle);
    labels += `<text x="${lx}" y="${ly}" fill="#FFFCF5" font-family="Karla, sans-serif" font-size="11" font-weight="700" text-anchor="middle" dominant-baseline="middle" transform="rotate(${midAngle > 90 && midAngle < 270 ? midAngle + 180 : midAngle}, ${lx}, ${ly})">${escapeHtml(truncate(recipes[i].title, 16))}</text>`;
  }

  return `<svg viewBox="0 0 300 300" xmlns="http://www.w3.org/2000/svg">${paths}${labels}</svg>`;
}

function polarToCartesian(cx, cy, r, angleDeg){
  const rad = (angleDeg * Math.PI) / 180;
  return [cx + r * Math.cos(rad), cy + r * Math.sin(rad)];
}

function truncate(str, len){
  return str.length > len ? str.slice(0, len - 1) + '…' : str;
}

function renderWheel(){
  const recipes = wheelRecipes();
  const filterOptions = ['All', ...CATEGORIES];

  app.innerHTML = `
    <div class="wheel-page">
      <button class="back-link" id="back-btn" style="margin-bottom: 6px;">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M15 18l-6-6 6-6"/></svg>
        Back to recipes
      </button>
      <h2>What's for dinner?</h2>
      <p class="sub">Pick a category, or draw from everything, then give it a spin.</p>
      <div class="wheel-filters" id="wheel-filters">
        ${filterOptions.map(c => `<button class="pill ${c === wheelCategory ? 'active' : ''}" data-cat="${escapeAttr(c)}">${escapeHtml(c)}</button>`).join('')}
      </div>
      ${recipes.length === 0 ? `
        <p class="wheel-empty">No recipes in this category yet — add one, or choose a different category.</p>
      ` : `
        <div class="wheel-stage">
          <div class="pointer"></div>
          <div class="wheel-svg-wrap" id="wheel-svg-wrap" style="transform: rotate(${wheelRotation}deg)">
            ${buildWheelSvg(recipes)}
          </div>
          <div class="hub"></div>
        </div>
        <button class="spin-btn" id="spin-btn">Spin</button>
      `}
      <div class="wheel-result" id="wheel-result"></div>
    </div>
  `;

  document.getElementById('back-btn').addEventListener('click', () => { location.hash = '#/'; });

  document.getElementById('wheel-filters').addEventListener('click', e => {
    const btn = e.target.closest('.pill');
    if(!btn) return;
    wheelCategory = btn.dataset.cat;
    wheelRotation = 0;
    renderWheel();
  });

  const spinBtn = document.getElementById('spin-btn');
  if(spinBtn) spinBtn.addEventListener('click', spinWheel);
}

function spinWheel(){
  const recipes = wheelRecipes();
  const spinBtn = document.getElementById('spin-btn');
  const resultBox = document.getElementById('wheel-result');
  const wrap = document.getElementById('wheel-svg-wrap');
  spinBtn.disabled = true;
  resultBox.innerHTML = '';

  const n = recipes.length;
  const seg = 360 / n;
  const targetIndex = Math.floor(Math.random() * n);
  const segCenter = targetIndex * seg + seg / 2;
  const pointerAngle = 270;
  const extraSpins = 5 * 360;
  const delta = ((pointerAngle - segCenter) % 360 + 360) % 360;

  wheelRotation += extraSpins + delta;
  wrap.style.transform = `rotate(${wheelRotation}deg)`;

  const prefersReduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const delay = prefersReduced ? 50 : 3200;

  setTimeout(() => {
    const picked = recipes[targetIndex];
    resultBox.innerHTML = `
      <div class="reveal">
        <p>Tonight, you're making</p>
        <h3>${escapeHtml(picked.title)}</h3>
        <a class="go" href="#/recipe/${escapeAttr(picked.id)}">View the recipe</a>
      </div>
    `;
    spinBtn.disabled = false;
  }, delay);
}

/* ---------- Router ---------- */

function escapeHtml(str){
  return String(str).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
function escapeAttr(str){ return escapeHtml(str); }

function route(){
  const hash = location.hash || '#/';
  if(hash.startsWith('#/recipe/')){
    renderDetail(decodeURIComponent(hash.replace('#/recipe/', '')));
  } else if(hash === '#/wheel'){
    renderWheel();
  } else {
    renderHome();
  }
  window.scrollTo(0, 0);
}

window.addEventListener('hashchange', route);
route();
</script>
